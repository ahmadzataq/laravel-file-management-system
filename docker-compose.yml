services:
  db:
    image: postgres:16-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fms
      POSTGRES_USER: fms
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - fms-pgdata:/var/lib/postgresql/data

volumes:
  fms-pgdata:
